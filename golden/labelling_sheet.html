<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Set Labelling</title>
<style>
:root {
  --bg:#faf9f7; --card:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e2e0dc;
  --accent:#2d6a4f; --accent-soft:#e8f2ed; --warn:#a4531f; --shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#16171a; --card:#1e2024; --ink:#e8e6e3; --muted:#9a9894;
          --line:#2e3136; --accent:#6fbf94; --accent-soft:#22322a; --warn:#d99b63;
          --shadow:0 1px 3px rgba(0,0,0,.3); }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line);
         padding:12px 20px; display:flex; gap:16px; align-items:center; z-index:10; box-shadow:var(--shadow); }
h1 { font-size:16px; margin:0; font-weight:650; }
.wrap { max-width:820px; margin:0 auto; padding:24px 20px 120px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px;
        padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
.msg { background:var(--accent-soft); border-left:3px solid var(--accent);
       padding:12px 14px; border-radius:0 6px 6px 0; margin:10px 0; white-space:pre-wrap; }
.reply { background:var(--bg); border:1px solid var(--line); padding:12px 14px;
         border-radius:6px; margin:10px 0; white-space:pre-wrap; }
.lbl { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
       font-weight:650; margin-bottom:4px; }
.opts { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px; }
button.opt { font:inherit; font-size:13px; padding:7px 12px; border:1px solid var(--line);
             background:var(--card); color:var(--ink); border-radius:6px; cursor:pointer; }
button.opt:hover { border-color:var(--accent); }
button.opt.sel { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.scale { display:flex; gap:6px; }
.scale button { flex:1; }
.dim { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
.dim:first-of-type { border-top:none; }
.q { color:var(--muted); font-size:13px; margin-bottom:6px; }
.hint { font-size:12px; color:var(--muted); margin-top:6px; min-height:1.4em; }
.nav { position:fixed; bottom:0; left:0; right:0; background:var(--card);
       border-top:1px solid var(--line); padding:12px 20px; display:flex;
       gap:12px; justify-content:center; align-items:center; }
.nav button { font:inherit; padding:9px 18px; border-radius:7px; border:1px solid var(--line);
              background:var(--card); color:var(--ink); cursor:pointer; }
.nav button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
.prog { height:4px; background:var(--line); border-radius:2px; overflow:hidden; flex:1; max-width:220px; }
.prog i { display:block; height:100%; background:var(--accent); width:0; transition:width .2s; }
details { margin:10px 0; } summary { cursor:pointer; font-size:13px; color:var(--muted); }
details .body { font-size:13px; color:var(--muted); padding:8px 0 0 12px; }
.kbd { font-family:ui-monospace,Menlo,monospace; font-size:11px; background:var(--bg);
       border:1px solid var(--line); border-radius:4px; padding:1px 5px; }
.done { text-align:center; padding:40px 20px; }
table { border-collapse:collapse; width:100%; font-size:13px; margin-top:12px; }
td,th { border:1px solid var(--line); padding:6px 9px; text-align:left; }
</style>
</head>
<body>
<header>
  <h1>Golden Set Labelling</h1>
  <span id="phase" class="lbl" style="margin:0"></span>
  <div class="prog"><i id="bar"></i></div>
  <span id="count" style="font-size:13px;color:var(--muted)"></span>
</header>
<div class="wrap" id="root"></div>
<div class="nav">
  <button id="back">&larr; Back</button>
  <div class="prog" style="max-width:120px"><i id="bar2"></i></div>
  <button id="next" class="primary">Next &rarr;</button>
  <button id="export">Export CSV</button>
</div>

ou reach out, be sure to let us know what type of device you're using. [link]", "presented_order": 45}, {"item_id": "g111::always_dm", "golden_id": "g111", "system": "always_dm", "message": "ordered air pods replacement case 4 days ago forced to pay £7.44 postage and still haven’t arrived. THIEVES!!!!", "reply": "We're here for you. Send us a DM, and we'll take a closer look at the issue together there.", "actual": "Let's look into this. Please reach out to us in DM so we can gather some information. [link]", "presented_order": 46}, {"item_id": "g114::simple", "golden_id": "g114", "system": "simple", "message": "I’m sick and tired of my phone lagging and freezing. Y’all better fix it or bout to know me", "reply": "We'd like to help with your iPhone's performance. Please DM us the model iPhone and exact iOS version you're using to start.", "actual": "We're here for you. Click here to team up wit us in DM. We'll continue there: [link]", "presented_order": 47}, {"item_id": "g022::always_dm", "golden_id": "g022", "system": "always_dm", "message": "My 7 plus iPhone's battery has been dying extremely fast.... does replace batteries for free...?", "reply": "We're here for you. Send us a DM, and we'll take a closer look at the issue together there.", "actual": "We'd like to help look into your battery issues. Go ahead and send us a DM telling us more details and we can work together. [link]", "presented_order": 48}, {"item_id": "g066::agent", "golden_id": "g066", "system": "agent", "message": "pls fix my fuckin phone right the fuck now.. I️ <— am fed the fuck up!!!!", "reply": "Let us help. Does that happen when using a specific application/feature, or does it happen at random? DM us back, please.", "actual": "Here’s what you can do to work around the issue until it’s fixed in a future software update: [link]", "presented_order": 49}, {"item_id": "g138::agent", "golden_id": "g138", "system": "agent", "message": "I will send a message to someone, but later he will answer me, to look into this with you. To start, send us a DM letting us know which device and software version you’re using.", "actual": "Here’s what you can do to work around the issue until it’s fixed in a future software update: [link]", "presented_order": 54}, {"item_id": "g120::trivial", "golden_id": "g120", "system": "trivial", "message": "I’m so done with products. My phone was perfectly fine before the IPhone 8. What’s the deal with the battery issue ?", "reply": "Hey there! Sorry to hear you're having trouble. We're looking into this and will get back to you as soon as we can.", "actual": "Battery Life is important, so let’s get to the bottom of this. Which iOS version, and iPhone are you using?", "presented_order": 55}, {"item_id": "g006::agent", "golden_id": "g006", "system": "agent", "message": "New #Apple #iOS11 upgrade is shocking. Ruined the phone Can you reverse it?? If not going to give a go.", "reply": "We're here for you! Send us a DM, and we'll take a closer look at your device together.", "actual": "We'd like to see how we can help. Meet up with us in DM with some specific details, and we'll work on this together. [link]", "presented_order": 56}, {"item_id": "g019::simple", "golden_id": "g019", "system": "simple", "message": "my iphone 6s battery is draining down every 2 minutes and it’s overheating ever since i updated to ios 11 PLEASE. FIX. THIS.", "reply": "Let's try leaving the group and rejoining the group. Let us know if that helps:", "actual": "Allow us to take a look. What is the device model; did you allow a few hours for app updates as well ? Send us a DM. [link]", "presented_order": 57}, {"item_id": "g136::trivial", "golden_id": "g136", "system": "trivial", "message": "my Apple Smart Keyboard is not responding every time my iPad wakes up. I just got the two a couple of days back.", "reply": "Hey there! Sorry to hear you're having trouble. We're looking into this and will get back to you as soon as we can.", "actual": "Let's look into this together. Which iOS version is installed on your iPad? Has it been restarted since you noticed the issue?", "presented_order": 58}, {"item_id": "g209::trivial", "golden_id": "g209", "system": "trivial", "message": "My Apple Music has been messing up since the new update! Cannot think of a worse possible outcome. Not the music", "reply": "Hey there! Sorry to hear you're having trouble. We're looking into this and will get back to you as soon as we can.", "actual": "What's happening specifically with Apple Music? We'd love to know the details via DM to see how we can help. When you reach out, be sure to let us know what type of device you're using. [link]", "presented_order": 59}, {"item_id": "g031::trivial", "golden_id": "g031", "system": "trivial", "message": "these damn boxes with question marks are annoying as hell and my phone is updated so can explain this", "reply": "Hey there! Sorry to hear you're having trouble. We're looking into this and will get back to you as soon as we can.", "actual": "Just to make sure we’re on the same page. When are you seeing the boxes with question marks? Let us know in DM to proceed. [link]", "presented_order": 60}, {"item_id": "g029::trivial", "golden_id": "g029", "system": "trivial", "message": "I've been trying to setup my new X by restoring from my 11.2 iPhone 7 Plus backup from earlier today but it's greyed out on my X. It says I need 11.2 so I can't restore.", "reply": "Hey there! Sorry to hear you're having trouble. We're looking into this and will get back to you as soon as we can.", "actual": "We are happy to help you get your new iPhone set up. To clarify, are you using the iOS beta profile on your iPhone 7?", "presented_order": 61}, {"item_id": "g205::trivial", "golden_id": "g205", "system": "trivial", "message": "Fed up with the update, the iphone is getting more problems everytime i update! After 10 years of iphone usage, im buying samsung at least i get better camera😒", "reply": "Hey there! Sorry to hear you're having trouble. We're looking into this and will get back to you as soon as we can.", "actual": "This is not the experience we want you to have. What specific issue are you having?", "presented_order": 62}], "intents": [{"id": "battery_power", "name": "Battery and power", "definition": "Battery draining unusually fast, not charging, charging slowly, or the device shutting down unexpectedly at non-zero charge. The complaint is about how long the device stays alive."}, {"id": "os_update", "name": "OS update problems", "definition": "The update itself is the subject: it will not install, is not offered, stalled, or the customer wants to undo it. Also regressions the customer explicitly attributes to updating, where no more specific class fits."}, {"id": "device_performance", "name": "Device performance and stability", "definition": "The device freezes, crashes, restarts, runs slowly, or the screen is unresponsive. A software-level fault in how the device behaves, with no physical damage reported."}, {"id": "connectivity", "name": "Connectivity and accessories", "definition": "Wi-Fi, Bluetooth, cellular, AirPlay, hotspot, or pairing and behaviour of accessories such as AirPods, Watch, or CarPlay."}, {"id": "app_software", "name": "App and software behaviour", "definition": "A specific app or software feature misbehaves - Messages, Mail, Music, Photos, Safari, iTunes, Pages, keyboard and autocorrect. Includes the iOS 11 autocorrect bug rendering \"I\" as a boxed question mark."}, {"id": "account_appleid", "name": "Apple ID, iCloud and purchases", "definition": "Apple ID sign-in, password, two-factor, iCloud storage or sync, App Store or iTunes purchases, subscriptions and charges. Anything where identity, stored data, or money is at stake."}, {"id": "hardware_repair", "name": "Hardware damage, repair and warranty", "definition": "Physical damage, repair cost, warranty or AppleCare coverage, service appointments, replacements and trade-ins. Something must be physically fixed or a commercial decision made."}, {"id": "feedback_complaint", "name": "Complaint and product feedback", "definition": "Dissatisfaction, frustration or product opinion with no specific diagnosable fault, and no request that could be actioned. Includes \"fix your stuff\" venting and feature opinions."}, {"id": "acknowledgement", "name": "Acknowledgement and thanks", "definition": "Thanks, praise, confirmation that a fix worked, or a closing message. No outstanding request."}, {"id": "other", "name": "Other", "definition": "Anything the classes above do not cover: contentless fragments, off-topic chatter, press or developer enquiries, product availability and pricing questions, scam and phishing reports. NOTE: language is deliberately NOT a criterion. A non-English message is labelled by its actual intent; routing to a language-capable agent is a separate decision from what the customer wants."}], "dimensions": [{"id": "grounded", "name": "Grounded in brand precedent", "question": "Does this reply match how the brand has actually handled this kind of issue before? Judge against the retrieved past exchanges, not against what good support looks like in general.", "scale": {"1": "Contradicts the precedent, or invents product behaviour, policy, timelines or compensation.", "2": "Loosely related to the precedent but adds unsupported specifics.", "3": "Consistent with precedent but generic - could have been written without it.", "4": "Clearly uses the precedent; the concrete step traces to a past exchange.", "5": "Uses the precedent precisely, including the specific step or question the brand actually uses."}}, {"id": "actionable", "name": "Actionable", "question": "Does the customer come away knowing what happens next?", "scale": {"1": "No next step at all. Pure acknowledgement or deflection.", "2": "Vague gesture at help without saying what to do.", "3": "A next step, but ambiguous or requiring guesswork.", "4": "One clear next step the customer can take immediately.", "5": "One clear next step, correctly targeted at this specific issue."}}, {"id": "safe", "name": "Safe", "question": "Could sending this publicly cause harm - to the customer, or to the brand?", "scale": {"1": "Requests credentials/payment details publicly, or promises money or outcomes the brand has not authorised.", "2": "Makes a factual claim about policy or timelines with no support.", "3": "Minor overreach or over-confidence, unlikely to cause real harm.", "4": "Nothing unsupported; appropriately hedged.", "5": "Actively safe: avoids public disclosure of personal data and routes sensitive matters privately."}}, {"id": "tone", "name": "Brand voice", "question": "Does this sound like this brand's support team as seen in the examples?", "scale": {"1": "Wrong register entirely - robotic, cold, or wildly off-brand.", "2": "Generic corporate support voice with no brand character.", "3": "Acceptable but bland.", "4": "Recognisably the brand's voice: warm, brief, natural.", "5": "Indistinguishable from a real reply by this team."}}], "binary": {"id": "send_as_is", "name": "Would you send this reply as-is?", "question": "Imagine you are the support agent on shift and this draft is in front of you. Would you press send without editing it? Answer YES only if you would send it unchanged. If you would rewrite even one clause, answer NO."}, "calibration": ["A reply that only says 'please DM us' is NOT automatically bad - the brand does this often. Judge whether it is the right move for THIS message.", "Do not reward length. The brand's real replies are short.", "Do not penalise a reply for failing to solve something that genuinely requires account access.", "A safe holding reply where no precedent exists is a correct outcome, not a failure.", "Judge the reply in front of you, not the reply you would have written."]};
const KEY = "golden_labelling_v1";
let state = JSON.parse(localStorage.getItem(KEY) || '{"a":{},"b":{},"i":0}');
const items = [
  ...DATA.part_a.map(x => ({kind:"a", ...x})),
  ...DATA.part_b.map(x => ({kind:"b", ...x}))
];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

function render(){
  const i = Math.max(0, Math.min(state.i, items.length));
  state.i = i;
  if (i >= items.length) return renderDone();
  const it = items[i];
  document.getElementById("phase").textContent =
    it.kind === "a" ? "Part A - intent" : "Part B - reply quality";
  document.getElementById("count").textContent = (i+1) + " / " + items.length;
  const pct = (i/items.length*100).toFixed(1) + "%";
  document.getElementById("bar").style.width = pct;
  document.getElementById("bar2").style.width = pct;

  const root = document.getElementById("root");
  root.innerHTML = "";
  root.appendChild(it.kind === "a" ? cardA(it) : cardB(it));
  window.scrollTo(0,0);
}

function cardA(it){
  const c = el("div","card");
  c.appendChild(el("div","lbl","Customer message"));
  c.appendChild(el("div","msg", it.message));

  const cur = state.a[it.golden_id] || {};
  c.appendChild(el("div","lbl","Intent - what does the customer WANT?"));
  const io = el("div","opts");
  DATA.intents.forEach((intent, n) => {
    const b = el("button","opt", (n+1) + ". " + intent.id);
    if (cur.intent === intent.id) b.classList.add("sel");
    b.onclick = () => { cur.intent = intent.id; state.a[it.golden_id]=cur; save(); render(); };
    io.appendChild(b);
  });
  c.appendChild(io);

  const d = el("details"); d.appendChild(el("summary", null, "Intent definitions"));
  const db = el("div","body");
  DATA.intents.forEach(x => db.appendChild(el("div", null, x.id + " - " + x.definition)));
  d.appendChild(db); c.appendChild(d);

  c.appendChild(el("div","lbl","Route - can a bot handle this alone?"));
  const ro = el("div","opts");
  [["auto","AUTO - a bot can handle it"],["escalate","ESCALATE - needs a human"]].forEach(([v,label]) => {
    const b = el("button","opt",label);
    if (cur.route === v) b.classList.add("sel");
    b.onclick = () => { cur.route = v; state.a[it.golden_id]=cur; save(); render(); };
    ro.appendChild(b);
  });
  c.appendChild(ro);
  c.appendChild(el("div","hint","Keys: 1-"+DATA.intents.length+" intent, A auto, E escalate, Enter next"));
  return c;
}

function cardB(it){
  const c = el("div","card");
  c.appendChild(el("div","lbl","Customer wrote"));
  c.appendChild(el("div","msg", it.message));
  c.appendChild(el("div","lbl","Draft reply under review"));
  c.appendChild(el("div","reply", it.reply || "(empty reply)"));

  const d = el("details"); d.appendChild(el("summary",null,"What the brand actually replied (context, not a model answer)"));
  const db = el("div","body", it.actual); d.appendChild(db); c.appendChild(d);

  const cur = state.b[it.item_id] || {};
  DATA.dimensions.forEach(dim => {
    const w = el("div","dim");
    w.appendChild(el("div","lbl", dim.name));
    w.appendChild(el("div","q", dim.question));
    const row = el("div","opts scale");
    [1,2,3,4,5].forEach(v => {
      const b = el("button","opt", String(v));
      b.title = dim.scale[String(v)] || "";
      if (cur[dim.id] === v) b.classList.add("sel");
      b.onclick = () => { cur[dim.id]=v; state.b[it.item_id]=cur; save(); render(); };
      row.appendChild(b);
    });
    w.appendChild(row);
    if (cur[dim.id]) w.appendChild(el("div","hint", dim.scale[String(cur[dim.id])]));
    else w.appendChild(el("div","hint","Hover a number to see what it means."));
    c.appendChild(w);
  });

  const w = el("div","dim");
  w.appendChild(el("div","lbl", DATA.binary.name));
  w.appendChild(el("div","q", DATA.binary.question));
  const row = el("div","opts");
  [["yes","YES - send unchanged"],["no","NO - I would edit it"]].forEach(([v,label]) => {
    const b = el("button","opt",label);
    if (cur.send_as_is === v) b.classList.add("sel");
    b.onclick = () => { cur.send_as_is=v; state.b[it.item_id]=cur; save(); render(); };
    row.appendChild(b);
  });
  w.appendChild(row);
  c.appendChild(w);
  c.appendChild(el("div","hint","Keys: 1-5 scores each dimension in order, Y/N for send, Enter next"));
  return c;
}

function renderDone(){
  document.getElementById("phase").textContent = "Complete";
  document.getElementById("bar").style.width = "100%";
  document.getElementById("bar2").style.width = "100%";
  const root = document.getElementById("root");
  root.innerHTML = "";
  const c = el("div","card done");
  c.appendChild(el("h2",null,"All done - thank you"));
  c.appendChild(el("p",null,
    "Click Export CSV and save the file as golden/human_labels.csv in the repo."));
  const t = document.createElement("table");
  t.innerHTML = "<tr><th>Section</th><th>Answered</th></tr>" +
    "<tr><td>Part A (intent)</td><td>"+Object.keys(state.a).length+" / "+DATA.part_a.length+"</td></tr>" +
    "<tr><td>Part B (replies)</td><td>"+Object.keys(state.b).length+" / "+DATA.part_b.length+"</td></tr>";
  c.appendChild(t);
  root.appendChild(c);
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

document.getElementById("next").onclick = () => { state.i++; save(); render(); };
document.getElementById("back").onclick = () => { state.i--; save(); render(); };
document.getElementById("export").onclick = exportCsv;

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const it = items[state.i];
  if (e.key === "Enter") { state.i++; save(); render(); return; }
  if (e.key === "Backspace") { e.preventDefault(); state.i--; save(); render(); return; }
  if (!it) return;
  if (it.kind === "a") {
    const n = parseInt(e.key,10);
    if (n >= 1 && n <= DATA.intents.length) {
      const cur = state.a[it.golden_id] || {};
      cur.intent = DATA.intents[n-1].id; state.a[it.golden_id]=cur; save(); render();
    }
    if (e.key.toLowerCase()==="a"||e.key.toLowerCase()==="e") {
      const cur = state.a[it.golden_id] || {};
      cur.route = e.key.toLowerCase()==="a" ? "auto":"escalate";
      state.a[it.golden_id]=cur; save(); render();
    }
  } else {
    const cur = state.b[it.item_id] || {};
    const n = parseInt(e.key,10);
    if (n >= 1 && n <= 5) {
      const next = DATA.dimensions.find(d => !(d.id in cur));
      if (next) { cur[next.id]=n; state.b[it.item_id]=cur; save(); render(); }
    }
    if (e.key.toLowerCase()==="y"||e.key.toLowerCase()==="n") {
      cur.send_as_is = e.key.toLowerCase()==="y" ? "yes":"no";
      state.b[it.item_id]=cur; save(); render();
    }
  }
});

function exportCsv(){
  const rows = [["section","golden_id","item_id","system","presented_order",
                 "intent","route","grounded","actionable","safe","tone","send_as_is"]];
  DATA.part_a.forEach(it => {
    const v = state.a[it.golden_id]; if (!v) return;
    rows.push(["A", it.golden_id, "", "", "", v.intent||"", v.route||"", "","","","",""]);
  });
  DATA.part_b.forEach(it => {
    const v = state.b[it.item_id]; if (!v) return;
    rows.push(["B", it.golden_id, it.item_id, it.system, it.presented_order, "", "",
               v.grounded||"", v.actionable||"", v.safe||"", v.tone||"", v.send_as_is||""]);
  });
  const csv = rows.map(r => r.map(x => {
    const s = String(x ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "human_labels.csv";
  a.click();
}

render();
</script>
</body>
</html>
