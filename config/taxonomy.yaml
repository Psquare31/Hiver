# Intent taxonomy for AppleSupport.
#
# PROVENANCE: authored by reading results/intent_clusters_AppleSupport.txt
# (TF-IDF + KMeans, k swept 6-14, k=10 read in detail). Clustering was a reading
# aid only - silhouette peaked at 0.023 and one cluster absorbed 52% of
# messages, so the clusters are not usable as labels. Each intent traces to
# observed structure via `derived_from`.
#
# CORPUS CONTEXT THAT SHAPES THIS TAXONOMY: 96% of the corpus falls in
# Oct-Dec 2017, the iOS 11 release window. The clusters are therefore dominated
# by one product event - battery regressions, post-update faults, and the
# "I" -> question-mark-in-a-box Unicode bug. A taxonomy fitted to this period
# will over-represent update-related intents relative to a normal support month.
# This is recorded here because it directly limits how far the headline numbers
# generalise, and it is restated in the report.
#
# DESIGN RULES
#  * Intents must be separable from the customer's FIRST message alone.
#  * Intents must differ in what the agent DOES. `device_performance` and
#    `hardware_repair` look similar but route differently (troubleshooting vs
#    booking a service appointment), so they stay separate.
#  * `other` is a real class, not a dumping ground. If it exceeds ~15% on a
#    labelled sample, the taxonomy is wrong and must be revised.

version: 2
brand: AppleSupport
brand_description: >-
  Apple's customer support account, covering iPhone, iPad, Mac, Watch, AirPods
  and Apple services such as iCloud, the App Store and Apple Music

intents:
  - id: battery_power
    name: Battery and power
    derived_from: [cluster_0, cluster_8]
    definition: >
      Battery draining unusually fast, not charging, charging slowly, or the
      device shutting down unexpectedly at non-zero charge. The complaint is
      about how long the device stays alive.
    positive_examples:
      - "I have a 6s and battery life is horrible now after upgrading to iOS 11"
      - "I Bought the iPhone X Today & My Phone Won't Charge Pass 4%"
      - "-10% for 30 minutes. iOS 11.2 iPad 2017. Why so fast."
    negative_examples:
      - "my phone keeps freezing since the update"
    default_route: auto

  - id: os_update
    name: OS update problems
    derived_from: [cluster_2, cluster_8]
    definition: >
      The update itself is the subject: it will not install, is not offered,
      stalled, or the customer wants to undo it. Also regressions the customer
      explicitly attributes to updating, where no more specific class fits.
    positive_examples:
      - "How can I undo the latest update please? I updated to 11.1.2 yesterday"
      - "I would just like to know why my phone STILL doesn't even offer the iOS 11 update"
      - "Currently at 26 minutes to boot up my computer after updating to High Sierra"
    negative_examples:
      - "battery life is worse since iOS 11"
    default_route: auto

  - id: device_performance
    name: Device performance and stability
    derived_from: [cluster_3, cluster_9, cluster_5]
    definition: >
      The device freezes, crashes, restarts, runs slowly, or the screen is
      unresponsive. A software-level fault in how the device behaves, with no
      physical damage reported.
    positive_examples:
      - "New iOS 11.0.3 on 6s: touchscreen is unresponsive, phone freezes completely"
      - "I have an iPhone 7, and I have to hard reset my phone more than twice a day"
      - "My iPhone just freezed to death. Had to reboot it."
    negative_examples:
      - "My current iPhone has a crack in the screen"
    default_route: auto

  - id: connectivity
    name: Connectivity and accessories
    derived_from: [cluster_3, cluster_8]
    definition: >
      Wi-Fi, Bluetooth, cellular, AirPlay, hotspot, or pairing and behaviour of
      accessories such as AirPods, Watch, or CarPlay.
    positive_examples:
      - "when i turn off wifi it automatically turns it back on after lock and unlock"
      - "My new airpods are skipping usually around 4-8 times within 4 mins"
      - "since you updated the iOS I can't airplay"
    negative_examples:
      - "how much for an Apple Watch screen replacement"
    default_route: auto

  - id: app_software
    name: App and software behaviour
    derived_from: [cluster_6, cluster_7]
    definition: >
      A specific app or software feature misbehaves - Messages, Mail, Music,
      Photos, Safari, iTunes, Pages, keyboard and autocorrect. Includes the
      iOS 11 autocorrect bug rendering "I" as a boxed question mark.
    positive_examples:
      - "Why does my phone change I into a question mark inside of a box?"
      - "I cannot download iTunes on my PC, please assist"
      - "Been facing this weird animation bug on iMessage and mail app"
    negative_examples:
      - "the whole phone freezes constantly"
    default_route: auto

  - id: account_appleid
    name: Apple ID, iCloud and purchases
    derived_from: [cluster_3, cluster_7]
    definition: >
      Apple ID sign-in, password, two-factor, iCloud storage or sync, App Store
      or iTunes purchases, subscriptions and charges. Anything where identity,
      stored data, or money is at stake.
    positive_examples:
      - "my iPhone won't stop stating an old Apple ID when I try to update apps"
      - "I can't sign in to iCloud, it keeps asking for a verification code"
      - "I was charged twice for an App Store purchase"
    negative_examples:
      - "my phone is slow since the update"
    default_route: escalate

  - id: hardware_repair
    name: Hardware damage, repair and warranty
    derived_from: [cluster_5]
    definition: >
      Physical damage, repair cost, warranty or AppleCare coverage, service
      appointments, replacements and trade-ins. Something must be physically
      fixed or a commercial decision made.
    positive_examples:
      - "how much would it cost to get my Apple Watch Series 1 a replacement screen?"
      - "My current iPhone has a crack in the screen. Do I need to repair it before sending it in?"
      - "Green vertical lines on start up, apple logo then a white screen"
    negative_examples:
      - "my screen is laggy since iOS 11"
    default_route: escalate

  - id: feedback_complaint
    name: Complaint and product feedback
    derived_from: [cluster_1, cluster_4]
    definition: >
      Dissatisfaction, frustration or product opinion with no specific
      diagnosable fault, and no request that could be actioned. Includes
      "fix your stuff" venting and feature opinions.
    positive_examples:
      - "Dear please can you stop releasing IOS updates full of bugs"
      - "ur iphone 8 is trash fix it or im gonna break my iphone"
      - "spent $2000 on an iPhone X and I'm disgusted at the product testing"
    negative_examples:
      - "my battery drains in 2 hours since 11.1"
    default_route: auto

  - id: acknowledgement
    name: Acknowledgement and thanks
    derived_from: [labelling_pass]
    definition: >
      Thanks, praise, confirmation that a fix worked, or a closing message. No
      outstanding request.
    positive_examples:
      - "That worked, thank you so much!"
      - "Thanks for responding"
    negative_examples:
      - "thanks for nothing, still broken"
    default_route: auto

  - id: other
    name: Other
    derived_from: [cluster_7]
    definition: >
      Anything the classes above do not cover: contentless fragments, off-topic
      chatter, press or developer enquiries, product availability and pricing
      questions, scam and phishing reports.
      NOTE: language is deliberately NOT a criterion. A non-English message is
      labelled by its actual intent; routing to a language-capable agent is a
      separate decision from what the customer wants.
    positive_examples:
      - "is non contiguous selection possible on Pages?"
      - "when is the iPhone X coming to Ireland"
    negative_examples:
      - "That worked, thank you!"
    default_route: escalate

# ---------------------------------------------------------------------------
# Escalation policy.
#
# `default_route` above is the prior for an intent. These rules override it for
# an individual message and are one-directional: they can only escalate, never
# force an auto-handle. Auto-handling something that needed a human is far more
# costly than the reverse, so every rule pushes the same way.
escalation_rules:
  - id: safety_hazard
    description: >
      Battery swelling, overheating, burning or smoke. Apple-specific and the
      highest-severity trigger here - a swollen battery is a fire risk and must
      never receive an automated troubleshooting reply.
    triggers: ["swollen", "swelling", "bulging", "overheating", "burning smell",
               "caught fire", "smoke", "exploded", "burnt", "too hot to touch"]
    reason: "Potential physical safety hazard - requires immediate human handling, not troubleshooting."

  - id: data_loss
    description: Irreplaceable data reported missing.
    triggers: ["lost all my photos", "photos are gone", "deleted everything",
               "lost my contacts", "backup failed", "data is gone", "wiped my"]
    reason: "Possible permanent data loss - needs a human to attempt recovery before further steps."

  - id: account_compromise
    description: Signs the Apple ID is compromised.
    triggers: ["hacked", "compromised", "someone else", "unauthorised",
               "unauthorized", "stolen", "not my apple id"]
    reason: "Account security incident - requires identity verification a bot cannot perform."

  - id: money_dispute
    description: A disputed transaction or refund demand.
    triggers: ["refund", "charged twice", "double charged", "chargeback",
               "money back", "fraudulent", "unauthorised charge"]
    reason: "Disputed transaction - financial action requires human authorisation."

  - id: legal_or_regulatory
    description: Legal threats, data protection requests, regulator mentions.
    triggers: ["lawyer", "legal action", "sue", "gdpr", "data protection",
               "ombudsman", "trading standards", "class action"]
    reason: "Legal or regulatory exposure - must be handled by a trained agent."

  - id: vulnerability_or_abuse
    description: Self-harm, threats, or abusive content requiring human judgement.
    triggers: ["kill myself", "suicide", "self harm", "threat"]
    reason: "Potential user-safety issue - requires immediate human attention."

  - id: repeat_contact
    description: Customer states they have already asked and been failed.
    triggers: ["third time", "3rd time", "again and again", "still waiting",
               "no one has replied", "weeks now", "months now"]
    reason: "Repeat unresolved contact - further automation risks escalating frustration."

# Confidence floor: below this, escalate regardless of intent, on the grounds
# that an uncertain classification is itself evidence a human should look.
low_confidence_threshold: 0.55
