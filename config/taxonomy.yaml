# Intent taxonomy for SpotifyCares.
#
# PROVENANCE: authored by reading the TF-IDF/KMeans cluster report at
# results/intent_clusters.txt (k swept 6-14, k=9 read in detail). Clustering was
# a reading aid only - silhouette peaked at 0.02, and one cluster absorbed 55% of
# messages, so the clusters are not usable as labels. Each intent below traces to
# observed cluster structure; the mapping is recorded in `derived_from`.
#
# DESIGN RULES
#  * Intents must be separable by a human from the customer's FIRST message
#    alone. If two intents need the resolution to tell apart, they are one intent.
#  * Intents must differ in what the agent DOES. `billing_charge` and
#    `subscription_manage` look similar but route differently (money dispute vs
#    self-serve explanation), so they stay separate.
#  * `other` is a real class, not a dumping ground for classifier failure. If it
#    exceeds ~15% on a sample, the taxonomy is wrong and must be revised.

version: 1
brand: SpotifyCares

intents:
  - id: playback_failure
    name: Playback failure
    derived_from: [cluster_5, cluster_0]
    definition: >
      Audio will not play, stops unexpectedly, skips, stutters, or the app
      crashes/freezes during use. The customer is reporting something broken,
      not asking how to do something.
    positive_examples:
      - "so your app just decides to stop playing music... great!"
      - "Hey what's going on the past couple days? It's crashing all the time."
      - "i can't play any song"
    negative_examples:
      - "why isn't the new Taylor Swift album on Spotify"
      - "how do I add songs to a playlist"
    default_route: auto

  - id: account_access
    name: Account access and security
    derived_from: [cluster_1, cluster_8]
    definition: >
      Cannot log in, locked out, forgotten credentials, account compromised or
      accessed by someone else, or needs to change the email/username tied to
      the account. Anything where identity or account ownership is at stake.
    positive_examples:
      - "Someone has compromised my account. I changed pw and they keep coming back"
      - "it says my email is no longer attached to an account"
      - "Someone is signing in to my spotify from a device that is not mine"
    negative_examples:
      - "how do I cancel premium"
    default_route: escalate

  - id: billing_charge
    name: Billing and unexpected charges
    derived_from: [cluster_3, cluster_6]
    definition: >
      A specific money complaint - charged unexpectedly, charged twice, wrong
      amount, charged after cancelling, or asking for a refund. There is a
      disputed transaction.
    positive_examples:
      - "I keep getting charged 9.99 and I havnt an account with you"
      - "I was charged for a regular subscription when I have a student one"
      - "why did I get charged $9.99 for this month"
    negative_examples:
      - "how much does family premium cost"
    default_route: escalate

  - id: subscription_manage
    name: Subscription and plan management
    derived_from: [cluster_6, cluster_3]
    definition: >
      Questions about plans rather than disputed money: how to upgrade,
      downgrade, cancel, start a trial, redeem a promo, add family members, or
      verify student status. Informational or self-serve.
    positive_examples:
      - "Premium for Family will not let me add members"
      - "if i already have premium and disable it and take the promotion, will it work"
      - "tried connecting Hulu and student Spotify today"
    negative_examples:
      - "I was charged twice this month"
    default_route: auto

  - id: content_missing
    name: Content availability
    derived_from: [cluster_7]
    definition: >
      A specific artist, album, track or podcast is absent, region-locked, or
      was removed. Usually a licensing matter Spotify cannot unilaterally fix.
    positive_examples:
      - "why the new Taylor Swift album isn't on Spotify?"
      - "You have SCANDAL but sadly not their best album yellow available in Germany"
      - "I can not find the Jonas Brothers album A Little Bit Longer at all"
    negative_examples:
      - "my downloaded songs disappeared"
    default_route: auto

  - id: device_compat
    name: Device and platform compatibility
    derived_from: [cluster_4]
    definition: >
      Issue is tied to a specific device, OS version, or platform - phone model,
      iOS/Android version, desktop, web player, smart TV, car, speakers. The
      customer names the hardware or OS.
    positive_examples:
      - "is there an ETA on when the iOS app will get iPhone X support"
      - "iPhone 6, 11.0.3 iPhone version and 8.4.25 Spotify version"
      - "Screen saver on smart TV whilst listening to Spotify"
    negative_examples:
      - "the app keeps crashing"
    default_route: auto

  - id: playlist_library
    name: Playlist and library management
    derived_from: [cluster_2]
    definition: >
      Organising saved music: creating/editing playlists, adding or removing
      tracks, library sync across devices, missing saved songs, recommendations
      and Discover Weekly behaviour.
    positive_examples:
      - "i added new songs to my playlist from my phone but on my computer the songs won't show"
      - "How do I remove songs from my account that I don't want anymore?"
      - "how dare you include Pentatonix in a recommended playlist for me"
    negative_examples:
      - "no song will play at all"
    default_route: auto

  - id: feature_request
    name: Feature request and product feedback
    derived_from: [cluster_0]
    definition: >
      Asking for functionality that does not exist, or giving product feedback,
      without reporting a fault. Often phrased "please add", "you should",
      "bring back".
    positive_examples:
      - "please please bring back the feature that shows who's following your playlists"
      - "The one thing I'd really like is the ability to drop a song from the mix"
      - "How about letting premium users have the queue function on their web player?"
    negative_examples:
      - "the queue function is broken"
    default_route: auto

  - id: acknowledgement
    name: Acknowledgement and thanks
    derived_from: [labelling_pass]   # NOT from clustering - see note below
    definition: >
      Thanks, praise, confirmation that an earlier fix worked, or a closing
      message. No outstanding request. Distinguished from `feature_request` by
      the absence of any ask, and from `other` by being clearly positive or
      conclusive rather than merely uncategorisable.
    positive_examples:
      - "It worked thank you very much for the assistance!!!!"
      - "Actually I just found it out, but thanks anyways"
      - "I would like to thank James for his excellent customer service"
    negative_examples:
      - "thanks for nothing but whatever, i'll just cancel"
    default_route: auto

  # ADDED AFTER LABELLING, NOT BEFORE.
  # The KMeans pass never surfaced this class - closing/thanks messages were
  # absorbed into the 55% catch-all cluster, which is exactly the failure mode
  # that makes clustering a reading aid rather than a taxonomy. It only became
  # visible when labelling put 12 of 32 `other` rows under one reason code.
  # Splitting it out drops `other` from 15.2% to 9.5%, back under the coverage
  # threshold this file sets for itself.

  - id: other
    name: Other
    derived_from: [cluster_0]
    definition: >
      Anything the classes above do not cover: pure venting with no actionable
      issue, contentless fragments, off-topic chatter, phishing/scam reports,
      country-level service availability, and artist/label (creator) enquiries.
      NOTE: language is deliberately NOT a criterion. A non-English message is
      labelled by its actual intent; routing to a language-capable agent is a
      separate decision from what the customer wants.
    positive_examples:
      - "DAMMIT FIX YOURSELF MF I NEED MUSIC"
      - "I got an email about registering for Spotify Soundwave, it looks suspicious"
      - "Spotify isn't available in Pakistan am& why's that?"
    negative_examples:
      - "It worked thank you very much!"
    default_route: escalate

# ---------------------------------------------------------------------------
# Escalation policy.
#
# `default_route` above is the prior for an intent. These rules override it for
# an individual message. They are deliberately asymmetric: auto-handling
# something that needed a human is far more costly than escalating something a
# bot could have answered, so every rule here pushes toward escalation.
escalation_rules:
  - id: account_compromise
    description: Any sign the account is compromised or accessed by a third party.
    triggers: ["hacked", "compromised", "someone else", "not me", "unauthorised", "unauthorized", "stolen"]
    reason: "Account security incident - requires identity verification a bot cannot perform."

  - id: money_dispute
    description: A disputed transaction or refund demand.
    triggers: ["refund", "charged twice", "double charged", "chargeback", "money back", "fraudulent"]
    reason: "Disputed transaction - financial action requires human authorisation."

  - id: legal_or_regulatory
    description: Legal threats, data protection requests, regulator mentions.
    triggers: ["lawyer", "legal", "sue", "gdpr", "data protection", "ombudsman", "trading standards"]
    reason: "Legal or regulatory exposure - must be handled by a trained agent."

  - id: vulnerability_or_abuse
    description: Self-harm, threats, or abusive content requiring human judgement.
    triggers: ["kill myself", "suicide", "harm", "threat"]
    reason: "Potential user-safety issue - requires immediate human attention."

  - id: repeat_contact
    description: Customer states they have already asked and been failed.
    triggers: ["third time", "3rd time", "again and again", "still waiting", "no one has replied", "weeks now"]
    reason: "Repeat unresolved contact - further automation risks escalating frustration."

# Confidence floor: below this, escalate regardless of intent, on the grounds
# that an uncertain classification is itself evidence a human should look.
low_confidence_threshold: 0.55
