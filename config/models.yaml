# Model arena and provider limits.
#
# Prices are the PUBLISHED PAID rates, in USD per 1M tokens. We run entirely on
# free tiers, so real spend is zero - but reporting zero would make the arena
# meaningless. The question the report answers is "how much accuracy per token",
# and equivalent-cost figures make that portable to anyone actually paying.
#
# Open-weight prices are Groq's published serving rates, not model licence
# costs; a self-hoster would see different economics.

providers:
  gemini:
    # Free tier: 10 RPM / 250K TPM / 1500 RPD on Flash.
    # RPM is what binds - the token budget is effectively unlimited for our size.
    rpm: 10
    tpm: 250000
    rpd: 1400          # headroom below the 1500 cap
    tpd: null
    # Gemini's daily request cap is account-wide, not per model.
    limit_scope: provider

  groq:
    # Free tier: 30 RPM / 8K TPM / 1K RPD / 200K TPD.
    # TOKENS PER DAY is what binds, not requests. A request-only limiter sails
    # past the check and then collects 429s for the rest of the day.
    rpm: 30
    tpm: 8000
    rpd: 950
    tpd: 190000        # headroom below the 200K cap
    # Groq publishes these PER MODEL, so each arena model gets its own budget.
    limit_scope: model

retry:
  max_attempts: 5
  base_delay_s: 2.0

models:
  # ---- Gemini -----------------------------------------------------------
  gemini_flash:
    provider: gemini
    model_id: gemini-3.7-flash
    role: draft            # primary drafter and primary judge
    input_price_per_1m: 0.30
    output_price_per_1m: 2.50
    # NOT gemini-3.8-flash. Free-tier quota is allocated PER MODEL, and the
    # newest Flash returns 429 RESOURCE_EXHAUSTED on this key while 3.7, 3.6
    # and 3.5 all serve normally. Newest != most available on a free tier.

  gemini_flash_36:
    provider: gemini
    model_id: gemini-3.6-flash
    role: classify         # arena entry, one generation back
    input_price_per_1m: 0.30
    output_price_per_1m: 2.50

  gemini_flash_lite:
    provider: gemini
    model_id: gemini-3.5-flash-lite
    role: classify
    input_price_per_1m: 0.10
    output_price_per_1m: 0.40

  gemini_flash_lite_31:
    provider: gemini
    model_id: gemini-3.1-flash-lite
    role: classify         # extra failover capacity, not an arena entry
    input_price_per_1m: 0.10
    output_price_per_1m: 0.40

  # CEILING ROW - REQUIRES BILLING, NOT JUST A KEY.
  # Pro models were removed from the Gemini free tier: the API reports
  # "limit: 0, model: gemini-3.1-pro" for free-tier input tokens. An AI Pro
  # subscription does not by itself enable this; its Cloud credit must be
  # linked as billing on the API project. Excluded from `arena` by default so
  # the pipeline runs without it; add it back once billing is attached.
  gemini_pro:
    provider: gemini
    model_id: gemini-3.1-pro-preview
    role: ceiling
    input_price_per_1m: 1.25
    output_price_per_1m: 10.00

  # ---- Groq (open weights) ---------------------------------------------
  gpt_oss_120b:
    provider: groq
    model_id: openai/gpt-oss-120b
    role: judge            # cross-family judge, guards against self-preference
    input_price_per_1m: 0.15
    output_price_per_1m: 0.75

  gpt_oss_20b:
    provider: groq
    model_id: openai/gpt-oss-20b
    role: classify
    input_price_per_1m: 0.10
    output_price_per_1m: 0.50

  qwen_27b:
    provider: groq
    model_id: qwen/qwen3.6-27b
    role: classify         # third model family in the arena
    input_price_per_1m: 0.15
    output_price_per_1m: 0.60

# Failover chains. Free-tier quota is per model and, on this key, far tighter
# than documented - gemini-3.8-flash and then 3.7-flash both returned
# RESOURCE_EXHAUSTED after fewer than 40 total requests. Without failover a
# 210-row evaluation cannot complete. The serving model is recorded per row.
# Chains are long on purpose. Quota exhaustion is per model AND rolling: over
# one session gemini-3.8 died, then 3.7, then 3.6, while 3.7 later recovered.
# Any single-model assumption breaks mid-run.
fallbacks:
  gemini_flash:         [gemini_flash_36, gemini_flash_lite, gemini_flash_lite_31]
  gemini_flash_36:      [gemini_flash_lite, gemini_flash_lite_31, gemini_flash]
  gemini_flash_lite:    [gemini_flash_lite_31, gemini_flash_36, gemini_flash]
  gemini_flash_lite_31: [gemini_flash_lite, gemini_flash_36]
  gpt_oss_120b:         [qwen_27b, gpt_oss_20b]
  gpt_oss_20b:          [qwen_27b, gpt_oss_120b]
  qwen_27b:             [gpt_oss_20b]

# Role assignments used by the pipeline unless overridden on the command line.
roles:
  # CLASSIFIER RUNS ON GROQ, DRAFTER AND JUDGE ON GEMINI - a budget decision,
  # not a quality one. Both Gemini models share one account-wide 10 RPM limit,
  # so putting classify and draft there made prediction alone 420 Gemini calls
  # at ~26s/row, and left too little of the daily allowance for the 840-call
  # judge run. Classification is short, structured, and well within Groq's
  # per-model token budget (210 x ~650 = 137K of 190K), so moving it there
  # halves Gemini load and roughly halves wall-clock.
  classifier: gpt_oss_20b
  drafter: gemini_flash
  # JUDGE ASSIGNMENT IS DECIDED BY MEASURED CAPACITY, NOT PREFERENCE.
  # A full judge run is 210 rows x 4 systems = 840 calls at ~1,111 tokens each
  # (~933K tokens). Groq's free tier allows 190K tokens/day/model = ~171 calls,
  # so it physically cannot be the primary judge. Gemini is request-limited
  # rather than token-limited (1,400/day), so it can.
  #
  # That puts Gemini in the uncomfortable position of judging drafts written by
  # Gemini. Rather than assert the bias away, the Groq cross-family judge scores
  # a capped subset and the delta between them is reported as a result - which
  # is the only honest way to handle a constraint you cannot design around.
  judge_primary: gemini_flash
  judge_cross_family: gpt_oss_120b
  judge_ceiling: gemini_pro

# Every model that takes part in the classification arena.
arena:
  - gemini_flash
  - gemini_flash_36
  - gemini_flash_lite
  - gpt_oss_120b
  - gpt_oss_20b
  - qwen_27b
# gemini_pro is deliberately absent - see the note on that model above.
