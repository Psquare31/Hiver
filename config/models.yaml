# Model arena and provider limits.
#
# Prices are the PUBLISHED PAID rates, in USD per 1M tokens. We run entirely on
# free tiers, so real spend is zero - but reporting zero would make the arena
# meaningless. The question the report answers is "how much accuracy per token",
# and equivalent-cost figures make that portable to anyone actually paying.
#
# Open-weight prices are Groq's published serving rates, not model licence
# costs; a self-hoster would see different economics.

providers:
  gemini:
    # Free tier: 10 RPM / 250K TPM / 1500 RPD on Flash.
    # RPM is what binds - the token budget is effectively unlimited for our size.
    rpm: 10
    tpm: 250000
    rpd: 1400          # headroom below the 1500 cap
    tpd: null
    # Gemini's daily request cap is account-wide, not per model.
    limit_scope: provider

  groq:
    # Free tier: 30 RPM / 8K TPM / 1K RPD / 200K TPD.
    # TOKENS PER DAY is what binds, not requests. A request-only limiter sails
    # past the check and then collects 429s for the rest of the day.
    rpm: 30
    tpm: 8000
    rpd: 950
    tpd: 190000        # headroom below the 200K cap
    # Groq publishes these PER MODEL, so each arena model gets its own budget.
    limit_scope: model

retry:
  max_attempts: 5
  base_delay_s: 2.0

models:
  # ---- Gemini -----------------------------------------------------------
  gemini_flash:
    provider: gemini
    model_id: gemini-3.8-flash
    role: draft            # primary drafter and primary judge
    input_price_per_1m: 0.30
    output_price_per_1m: 2.50

  gemini_flash_lite:
    provider: gemini
    model_id: gemini-3.5-flash-lite
    role: classify
    input_price_per_1m: 0.10
    output_price_per_1m: 0.40

  gemini_pro:
    provider: gemini
    model_id: gemini-3.1-pro-preview
    role: ceiling          # frontier reference row, paid via AI Pro credit
    input_price_per_1m: 1.25
    output_price_per_1m: 10.00

  # ---- Groq (open weights) ---------------------------------------------
  gpt_oss_120b:
    provider: groq
    model_id: openai/gpt-oss-120b
    role: judge            # cross-family judge, guards against self-preference
    input_price_per_1m: 0.15
    output_price_per_1m: 0.75

  gpt_oss_20b:
    provider: groq
    model_id: openai/gpt-oss-20b
    role: classify
    input_price_per_1m: 0.10
    output_price_per_1m: 0.50

  qwen_27b:
    provider: groq
    model_id: qwen/qwen3.6-27b
    role: classify         # third model family in the arena
    input_price_per_1m: 0.15
    output_price_per_1m: 0.60

# Role assignments used by the pipeline unless overridden on the command line.
roles:
  classifier: gemini_flash_lite
  drafter: gemini_flash
  judge_primary: gemini_flash
  judge_cross_family: gpt_oss_120b
  judge_ceiling: gemini_pro

# Every model that takes part in the classification arena.
arena:
  - gemini_flash
  - gemini_flash_lite
  - gemini_pro
  - gpt_oss_120b
  - gpt_oss_20b
  - qwen_27b
